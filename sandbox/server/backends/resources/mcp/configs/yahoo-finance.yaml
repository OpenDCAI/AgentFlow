# Yahoo Finance
# Source: https://github.com/Alex2Yang97/yahoo-finance-mcp
# Toolathlon Version: https://github.com/lockon-n/yahoo-finance-mcp
# Toolathlon_GYM: ../../local_servers/yahoo-finance-mcp
type: stdio
name: yahoo-finance
params:
  # Use the server venv directly instead of `uv run` so stdio passes through to FastMCP
  # and the server resolves dependencies from its own project environment.
  command: "${local_servers_paths}/yahoo-finance-mcp/.venv/bin/python3"
  args:
    - "server.py"
  cwd: "${local_servers_paths}/yahoo-finance-mcp"
client_session_timeout_seconds: 60
cache_tools_list: true
